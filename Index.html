<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Dash: Mitigasi Bencana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Press Start 2P', cursive;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            display: block;
            image-rendering: pixelated;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border: 4px solid #333;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            color: #fff;
            text-shadow: 2px 2px #000;
            z-index: 10;
        }

        .modal {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            border: 4px solid #facc15;
            padding: 20px;
            color: white;
            text-align: center;
            border-radius: 10px;
            max-width: 500px;
            display: none;
            z-index: 100;
        }

        .btn-option {
            background: #374151;
            border-bottom: 4px solid #111827;
            padding: 10px;
            margin: 5px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .btn-option:hover { background: #4b5563; }
        .btn-option:active { transform: translateY(2px); border-bottom-width: 2px; }

        .control-hint {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 10px;
            color: rgba(255,255,255,0.5);
        }

        #mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 30px;
            pointer-events: auto;
        }

        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-overlay">
        <div>SCORE: <span id="score">0</span></div>
        <div id="hearts">❤️❤️❤️</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Quiz Modal -->
    <div id="quiz-modal" class="modal">
        <h2 id="quiz-title" class="text-yellow-400 mb-4 text-sm">DARURAT!</h2>
        <p id="quiz-question" class="mb-6 text-xs leading-relaxed"></p>
        <div id="quiz-options" class="grid grid-cols-1 gap-2"></div>
        <p id="quiz-hint" class="mt-4 text-[8px] text-gray-400 italic"></p>
    </div>

    <!-- Start/GameOver Screens -->
    <div id="start-screen" class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center text-center z-50">
        <h1 class="text-3xl text-yellow-400 mb-6 italic">DISASTER DASH</h1>
        <p class="text-[10px] text-white mb-8 max-w-md">Lompati rintangan dan jawab kuis mitigasi untuk menyelamatkan kota!</p>
        <button onclick="startGame()" class="bg-green-600 hover:bg-green-500 text-white px-8 py-4 border-b-4 border-green-800 rounded">MULAI GAME</button>
    </div>

    <div id="game-over-screen" class="absolute inset-0 bg-red-900/90 flex flex-col items-center justify-center text-center z-50 hidden">
        <h1 class="text-3xl text-white mb-4">MISI GAGAL</h1>
        <p id="final-score" class="text-yellow-400 mb-8">SKOR: 0</p>
        <button onclick="location.reload()" class="bg-white text-red-900 px-8 py-4 border-b-4 border-gray-400 rounded">COBA LAGI</button>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <div class="flex gap-4">
            <button onmousedown="keys.left=true" onmouseup="keys.left=false" ontouchstart="keys.left=true" ontouchend="keys.left=false" class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center text-2xl">←</button>
            <button onmousedown="keys.right=true" onmouseup="keys.right=false" ontouchstart="keys.right=true" ontouchend="keys.right=false" class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center text-2xl">→</button>
        </div>
        <button onmousedown="keys.up=true" onmouseup="keys.up=false" ontouchstart="keys.up=true" ontouchend="keys.up=false" class="w-20 h-20 bg-yellow-500/50 rounded-full flex items-center justify-center text-xl">LOMPAT</button>
    </div>

    <div class="control-hint">GUNAKAN ARROW KEYS / WASD UNTUK BERGERAK</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const heartsEl = document.getElementById('hearts');
const quizModal = document.getElementById('quiz-modal');

let score = 0;
let health = 3;
let isPaused = false;
let gameActive = false;
let currentQuestionIndex = 0;

const questions = [
    { q: "Apa tindakan pertama saat gempa di dalam ruangan?", a: ["Lari ke lift", "Berlindung di bawah meja", "Berdiam diri", "Membuka jendela"], c: 1, h: "Cari perlindungan dari benda jatuh." },
    { q: "Warna jalur evakuasi yang benar adalah...", a: ["Merah", "Biru", "Hijau", "Kuning"], c: 2, h: "Warna keamanan internasional." },
    { q: "Tsunami biasanya diawali dengan...", a: ["Hujan lebat", "Air laut surut tiba-tiba", "Angin kencang", "Awan mendung"], c: 1, h: "Laut seolah 'menghisap' air." },
    { q: "Alat pemadam api ringan disebut...", a: ["APAR", "Hydrant", "Termometer", "Pompa"], c: 0, h: "Singkatan dari Alat Pemadam Api Ringan." },
    { q: "Jika ada asap kebakaran, kita harus...", a: ["Berdiri tegak", "Merangkak di lantai", "Berlari cepat", "Berteriak"], c: 1, h: "Asap bersih ada di dekat lantai." },
    { q: "Gempa di laut yang dangkal berisiko...", a: ["Badai", "Tsunami", "Banjir", "Longsor"], c: 1, h: "Pergerakan vertikal dasar laut." },
    { q: "Tas Siaga Bencana berisi...", a: ["Mainan", "Dokumen & Obat", "Baju pesta", "Alat masak"], c: 1, h: "Kebutuhan pokok bertahan hidup." },
    { q: "Nomor darurat nasional Indonesia...", a: ["911", "112", "123", "110"], c: 1, h: "Layanan terpadu pemerintah." },
    { q: "Mitigasi bencana bertujuan untuk...", a: ["Mencegah bencana", "Mengurangi risiko", "Menambah biaya", "Mencari bantuan"], c: 1, h: "Meminimalisir dampak korban." },
    { q: "Bencana meteorologi contohnya...", a: ["Gempa bumi", "Angin Puting Beliung", "Tsunami", "Erupsi"], c: 1, h: "Berhubungan dengan cuaca." },
    { q: "Skala kekuatan gempa disebut...", a: ["Celcius", "Richter", "Newton", "Pascal"], c: 1, h: "Sering disebut BMKG." },
    { q: "Tanda gunung akan meletus adalah...", a: ["Udara sejuk", "Sumber air mengering", "Burung datang", "Tanah subur"], c: 1, h: "Suhu kawah meningkat." },
    { q: "Banjir bandang sering terjadi karena...", a: ["Hutan gundul", "Banyak taman", "Sungai bersih", "Cuaca panas"], c: 0, h: "Resapan air yang hilang." },
    { q: "Simbol segitiga merah di peta bencana artinya...", a: ["Daerah aman", "Rawan bencana", "Rumah sakit", "Sekolah"], c: 1, h: "Warna peringatan bahaya." },
    { q: "Saat tsunami datang, lari ke...", a: ["Basement", "Tempat tinggi", "Tepi laut", "Dalam gua"], c: 1, h: "Hindari rendaman air." }
];

const gravity = 0.5;
const keys = { right: false, left: false, up: false };

class Player {
    constructor() {
        this.width = 40;
        this.height = 50;
        this.position = { x: 100, y: 100 };
        this.velocity = { x: 0, y: 0 };
        this.speed = 5;
        this.jumpStrength = -12;
        this.isGrounded = false;
    }

    draw() {
        // Simple Pixel Hero (SVG Style)
        ctx.fillStyle = '#facc15'; // Yellow Suit
        ctx.fillRect(this.position.x, this.position.y, this.width, this.height);
        ctx.fillStyle = '#ef4444'; // Red Helmet
        ctx.fillRect(this.position.x, this.position.y - 10, this.width, 15);
        ctx.fillStyle = '#000'; // Eyes
        ctx.fillRect(this.position.x + 25, this.position.y + 5, 5, 5);
        ctx.fillRect(this.position.x + 10, this.position.y + 5, 5, 5);
    }

    update() {
        this.draw();
        this.position.x += this.velocity.x;
        this.position.y += this.velocity.y;

        if (this.position.y + this.height + this.velocity.y <= canvas.height - 40) {
            this.velocity.y += gravity;
            this.isGrounded = false;
        } else {
            this.velocity.y = 0;
            this.isGrounded = true;
            this.position.y = canvas.height - 40 - this.height;
        }

        // Horizontal movement
        if (keys.right && this.position.x < canvas.width / 2) this.velocity.x = this.speed;
        else if (keys.left && this.position.x > 0) this.velocity.x = -this.speed;
        else this.velocity.x = 0;
    }
}

class Platform {
    constructor({ x, y, w = 200, h = 40, type = 'earth' }) {
        this.position = { x, y };
        this.width = w;
        this.height = h;
        this.type = type;
    }

    draw() {
        ctx.fillStyle = this.type === 'earth' ? '#78350f' : '#3b82f6';
        ctx.fillRect(this.position.x, this.position.y, this.width, this.height);
        ctx.fillStyle = this.type === 'earth' ? '#15803d' : '#60a5fa'; // Grass/Waves
        ctx.fillRect(this.position.x, this.position.y, this.width, 10);
    }
}

class Enemy {
    constructor({ x, y, type = 'fire' }) {
        this.position = { x, y };
        this.width = 30;
        this.height = 30;
        this.type = type;
        this.speed = 2;
        this.distance = 0;
        this.range = 100;
        this.dir = 1;
    }

    draw() {
        ctx.fillStyle = this.type === 'fire' ? '#f97316' : '#94a3b8';
        ctx.beginPath();
        ctx.arc(this.position.x + 15, this.position.y + 15, 15, 0, Math.PI * 2);
        ctx.fill();
        // Eyes
        ctx.fillStyle = '#fff';
        ctx.fillRect(this.position.x + 8, this.position.y + 10, 5, 5);
        ctx.fillRect(this.position.x + 17, this.position.y + 10, 5, 5);
    }

    update() {
        this.draw();
        this.position.x += this.speed * this.dir;
        this.distance += Math.abs(this.speed);
        if (this.distance > this.range) {
            this.dir *= -1;
            this.distance = 0;
        }
    }
}

let player;
let platforms = [];
let enemies = [];
let scrollOffset = 0;

function initLevel() {
    player = new Player();
    platforms = [
        new Platform({ x: 0, y: canvas.height - 40, w: 5000 }), // Ground
        new Platform({ x: 300, y: 400 }),
        new Platform({ x: 600, y: 300 }),
        new Platform({ x: 900, y: 450, w: 100, type: 'water' }),
        new Platform({ x: 1200, y: 350 }),
        new Platform({ x: 1600, y: 400 }),
        new Platform({ x: 1900, y: 250 }),
        new Platform({ x: 2300, y: 400 }),
        new Platform({ x: 2700, y: 300 }),
        new Platform({ x: 3100, y: 450 }),
    ];

    enemies = [
        new Enemy({ x: 400, y: 370 }),
        new Enemy({ x: 700, y: 270 }),
        new Enemy({ x: 1300, y: 320 }),
        new Enemy({ x: 1700, y: 370, type: 'rock' }),
        new Enemy({ x: 2000, y: 220 }),
        new Enemy({ x: 2400, y: 370, type: 'fire' }),
    ];
    
    score = 0;
    health = 3;
    scrollOffset = 0;
    updateUI();
}

function updateUI() {
    scoreEl.innerText = score;
    heartsEl.innerText = '❤️'.repeat(health) + '🖤'.repeat(3 - health);
}

function showQuiz() {
    isPaused = true;
    const q = questions[currentQuestionIndex];
    document.getElementById('quiz-question').innerText = q.q;
    document.getElementById('quiz-hint').innerText = "Petunjuk: " + q.h;
    
    const optionsContainer = document.getElementById('quiz-options');
    optionsContainer.innerHTML = '';
    
    q.a.forEach((opt, idx) => {
        const btn = document.createElement('div');
        btn.className = 'btn-option';
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(idx);
        optionsContainer.appendChild(btn);
    });

    quizModal.style.display = 'block';
}

function handleAnswer(idx) {
    const q = questions[currentQuestionIndex];
    if (idx === q.c) {
        score += 100;
        currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
        resumeGame();
    } else {
        health--;
        updateUI();
        if (health <= 0) gameOver();
        else resumeGame();
    }
}

function resumeGame() {
    isPaused = false;
    quizModal.style.display = 'none';
    updateUI();
}

function gameOver() {
    gameActive = false;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText = "SKOR AKHIR: " + score;
}

function startGame() {
    canvas.width = window.innerWidth;
    canvas.height = 600;
    document.getElementById('start-screen').classList.add('hidden');
    gameActive = true;
    initLevel();
    animate();
}

function animate() {
    if (!gameActive) return;
    if (isPaused) {
        requestAnimationFrame(animate);
        return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Scroll Background
    if (keys.right && player.position.x >= canvas.width / 2) {
        scrollOffset += player.speed;
        platforms.forEach(p => p.position.x -= player.speed);
        enemies.forEach(e => e.position.x -= player.speed);
    } else if (keys.left && scrollOffset > 0 && player.position.x <= 100) {
        scrollOffset -= player.speed;
        platforms.forEach(p => p.position.x += player.speed);
        enemies.forEach(e => e.position.x += player.speed);
    }

    platforms.forEach(platform => {
        platform.draw();
        // Collision detection
        if (player.position.y + player.height <= platform.position.y &&
            player.position.y + player.height + player.velocity.y >= platform.position.y &&
            player.position.x + player.width >= platform.position.x &&
            player.position.x <= platform.position.x + platform.width) {
            
            player.velocity.y = 0;
            player.isGrounded = true;
        }
    });

    enemies.forEach((enemy, index) => {
        enemy.update();
        // Collision with player
        if (player.position.x < enemy.position.x + enemy.width &&
            player.position.x + player.width > enemy.position.x &&
            player.position.y < enemy.position.y + enemy.height &&
            player.position.y + player.height > enemy.position.y) {
            
            enemies.splice(index, 1);
            showQuiz();
        }
    });

    player.update();

    // Jump logic
    if (keys.up && player.isGrounded) {
        player.velocity.y = player.jumpStrength;
        player.isGrounded = false;
    }

    requestAnimationFrame(animate);
}

// Input Handling
window.addEventListener('keydown', ({ keyCode }) => {
    switch (keyCode) {
        case 65: case 37: keys.left = true; break;
        case 68: case 39: keys.right = true; break;
        case 87: case 38: case 32: keys.up = true; break;
    }
});

window.addEventListener('keyup', ({ keyCode }) => {
    switch (keyCode) {
        case 65: case 37: keys.left = false; break;
        case 68: case 39: keys.right = false; break;
        case 87: case 38: case 32: keys.up = false; break;
    }
});

// Window Resize
window.addEventListener('resize', () => {
    if (gameActive) {
        canvas.width = window.innerWidth;
    }
});

</script>
</body>
</html>
